name: Backup DB

on:
  schedule:
    # 매일 05:00 KST (전날 20:00 UTC)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production backup is allowed only from refs/heads/main (received: $GITHUB_REF)."
          exit 1

      - name: Check backup secrets
        env:
          DB_URL_SET: ${{ secrets.SUPABASE_DB_URL != '' }}
          PASSPHRASE_SET: ${{ secrets.BACKUP_PASSPHRASE != '' }}
        run: |
          missing=""
          [ "$DB_URL_SET" != "true" ] && missing="$missing SUPABASE_DB_URL"
          [ "$PASSPHRASE_SET" != "true" ] && missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            {
              echo "## Backup failed — missing secrets:$missing"
              echo ""
              echo "Repository Settings > Secrets and variables > Actions에 등록하세요."
              echo "- \`SUPABASE_DB_URL\`: Dashboard > Connect의 Session pooler URI (비밀번호 포함)"
              echo "- \`BACKUP_PASSPHRASE\`: 덤프 암호화용 암구호 (분실 시 백업 복원 불가 — 비밀번호 관리자에 보관)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # 버전 고정 — latest는 백업 도구 체인을 비결정적으로 만든다 (복원 리허설과 동일 버전 유지)
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.1

      - name: Dump schema and data
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          date=$(TZ=Asia/Seoul date +%F)
          echo "DUMP_DATE=$date" >> "$GITHUB_ENV"
          mkdir -p dump
          supabase db dump --db-url "$DATABASE_URL" -f "dump/sqa-p1-workflow-$date-schema.sql"
          supabase db dump --db-url "$DATABASE_URL" --data-only -f "dump/sqa-p1-workflow-$date-data.sql"

      # OPERATIONS.md 매일 백업 확인 기준과 동일: 크기 > 0, schema에 CREATE TABLE, data에 COPY/INSERT
      - name: Validate dumps
        run: |
          schema="dump/sqa-p1-workflow-$DUMP_DATE-schema.sql"
          data="dump/sqa-p1-workflow-$DUMP_DATE-data.sql"
          for f in "$schema" "$data"; do
            [ -s "$f" ] || { echo "empty or missing dump: $f"; exit 1; }
          done
          grep -q "CREATE TABLE" "$schema" || { echo "schema dump has no CREATE TABLE"; exit 1; }
          grep -Eq "COPY |INSERT " "$data" || { echo "data dump has no COPY/INSERT"; exit 1; }

      # 이 저장소는 public일 수 있고, public repo의 아티팩트는 누구나 내려받을 수 있다.
      # 팀원 이름·이메일이 담긴 덤프는 반드시 암호화된 상태로만 업로드한다.
      - name: Encrypt dump
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set +x
          set -Eeuo pipefail
          [ -n "${PASSPHRASE:-}" ] || { echo "::error::BACKUP_PASSPHRASE is missing"; exit 1; }
          [[ "$PASSPHRASE" != *$'\n'* && "$PASSPHRASE" != *$'\r'* ]] || {
            echo "::error::BACKUP_PASSPHRASE must be a single-line secret"
            exit 1
          }

          archive="db-backup-$DUMP_DATE.tar.gz"
          gpg_output="$archive.gpg"
          gpg_temp="$gpg_output.tmp"
          legacy_output="$archive.enc"
          umask 077
          trap 'rm -f "$gpg_temp"' EXIT

          tar czf "$archive" -C dump .
          [ -s "$archive" ] && tar tzf "$archive" >/dev/null || {
            echo "::error::Backup archive is missing, empty, or invalid"
            exit 1
          }

          # Primary authenticated format. The passphrase is sent over stdin, never argv.
          printf '%s' "$PASSPHRASE" | gpg \
            --batch --no-tty --yes --pinentry-mode loopback --passphrase-fd 0 --no-symkey-cache \
            --symmetric --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 \
            --s2k-count 65011712 --compress-algo none \
            --output "$gpg_temp" -- "$archive"
          [ -s "$gpg_temp" ] || { echo "::error::GPG backup was not created"; exit 1; }
          printf '%s' "$PASSPHRASE" | gpg \
            --batch --no-tty --pinentry-mode loopback --passphrase-fd 0 --no-symkey-cache \
            --decrypt -- "$gpg_temp" | tar tzf - >/dev/null
          mv -f "$gpg_temp" "$gpg_output"

          # Transitional legacy copy. Keep until a .gpg restore rehearsal succeeds and
          # all operators have the updated runbook.
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$archive" -out "$legacy_output" -pass env:PASSPHRASE
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$legacy_output" -pass env:PASSPHRASE | tar tzf - >/dev/null

          rm -rf dump "$archive"
          unset PASSPHRASE
          trap - EXIT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-${{ env.DUMP_DATE }}
          path: |
            db-backup-${{ env.DUMP_DATE }}.tar.gz.gpg
            db-backup-${{ env.DUMP_DATE }}.tar.gz.enc
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## Backup OK — db-backup-$DUMP_DATE (.gpg primary + transitional .enc, 보존 90일)"
            echo ""
            echo "복호화·복원 절차: docs/OPERATIONS.md \"매일 백업\" 절 참고"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    needs: backup
    if: ${{ always() && needs.backup.result == 'failure' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the backup failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[Backup] Daily DB backup failed'
          body="Backup DB failed at $(date -u +%FT%TZ). Run: $RUN_URL"
          issue_number=$(gh issue list --state open --search "Daily DB backup failed in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
