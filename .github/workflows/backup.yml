name: Backup DB

on:
  schedule:
    # 매일 05:00 KST (전날 20:00 UTC)
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqa-production-release
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production backup is allowed only from refs/heads/main (received: $GITHUB_REF)."
          exit 1

      - name: Check backup secrets
        env:
          DB_URL_SET: ${{ secrets.SUPABASE_DB_URL != '' }}
          PASSPHRASE_SET: ${{ secrets.BACKUP_PASSPHRASE != '' }}
        run: |
          missing=""
          [ "$DB_URL_SET" != "true" ] && missing="$missing SUPABASE_DB_URL"
          [ "$PASSPHRASE_SET" != "true" ] && missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then
            {
              echo "## Backup failed — missing secrets:$missing"
              echo ""
              echo "Repository Settings > Secrets and variables > Actions에 등록하세요."
              echo "- \`SUPABASE_DB_URL\`: Dashboard > Connect의 Session pooler URI (비밀번호 포함)"
              echo "- \`BACKUP_PASSPHRASE\`: 덤프 암호화용 암구호 (분실 시 백업 복원 불가 — 비밀번호 관리자에 보관)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # 버전 고정 — latest는 백업 도구 체인을 비결정적으로 만든다 (복원 리허설과 동일 버전 유지)
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      - name: Dump DR package
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -Eeuo pipefail
          date=$(TZ=Asia/Seoul date +%F)
          echo "DUMP_DATE=$date" >> "$GITHUB_ENV"
          mkdir -p dump
          supabase db dump --db-url "$DATABASE_URL" --role-only -f dump/roles.sql
          supabase db dump --db-url "$DATABASE_URL" -f dump/schema.sql
          supabase db dump --db-url "$DATABASE_URL" --data-only -f dump/data.sql
          supabase db dump --db-url "$DATABASE_URL" --schema supabase_migrations \
            --data-only -f dump/migration-history.sql

          captured_at=$(date -u +%FT%TZ)
          node scripts/capture-dr-database-evidence.mjs \
            --captured-at "$captured_at" \
            --output dump/source-evidence.json
          storage_object_count=$(node -e \
            "const e=require('./dump/source-evidence.json'); process.stdout.write(String(e.configuration.storageObjectCount))")

          node scripts/verify-dr-package.mjs --write-manifest dump \
            --source-sha "$GITHUB_SHA" \
            --created-at "$captured_at" \
            --backup-class L2 \
            --auth-identity-included false \
            --storage-object-count "$storage_object_count"

      # 이 저장소는 public일 수 있고, public repo의 아티팩트는 누구나 내려받을 수 있다.
      # 팀원 이름·이메일이 담긴 덤프는 반드시 암호화된 상태로만 업로드한다.
      - name: Encrypt and revalidate DR package
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set +x
          set -Eeuo pipefail
          [ -n "${PASSPHRASE:-}" ] || { echo "::error::BACKUP_PASSPHRASE is missing"; exit 1; }
          [[ "$PASSPHRASE" != *$'\n'* && "$PASSPHRASE" != *$'\r'* ]] || {
            echo "::error::BACKUP_PASSPHRASE must be a single-line secret"
            exit 1
          }

          archive="db-backup-$DUMP_DATE.tar.gz"
          gpg_output="$archive.gpg"
          gpg_temp="$gpg_output.tmp"
          legacy_output="$archive.enc"
          primary_verify="verify-primary"
          legacy_verify="verify-legacy"
          umask 077
          trap 'rm -rf "$gpg_temp" "$archive" dump verify-primary verify-legacy' EXIT

          tar czf "$archive" -C dump .
          [ -s "$archive" ] && tar tzf "$archive" >/dev/null || {
            echo "::error::Backup archive is missing, empty, or invalid"
            exit 1
          }

          # Primary authenticated format. The passphrase is sent over stdin, never argv.
          printf '%s' "$PASSPHRASE" | gpg \
            --batch --no-tty --yes --pinentry-mode loopback --passphrase-fd 0 --no-symkey-cache \
            --symmetric --cipher-algo AES256 --s2k-mode 3 --s2k-digest-algo SHA512 \
            --s2k-count 65011712 --compress-algo none \
            --output "$gpg_temp" -- "$archive"
          [ -s "$gpg_temp" ] || { echo "::error::GPG backup was not created"; exit 1; }
          mkdir "$primary_verify"
          printf '%s' "$PASSPHRASE" | gpg \
            --batch --no-tty --pinentry-mode loopback --passphrase-fd 0 --no-symkey-cache \
            --decrypt -- "$gpg_temp" | tar xzf - -C "$primary_verify"
          node scripts/verify-dr-package.mjs "$primary_verify"
          mv -f "$gpg_temp" "$gpg_output"

          # Transitional legacy copy. Keep until a .gpg restore rehearsal succeeds and
          # all operators have the updated runbook.
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$archive" -out "$legacy_output" -pass env:PASSPHRASE
          mkdir "$legacy_verify"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$legacy_output" -pass env:PASSPHRASE | tar xzf - -C "$legacy_verify"
          node scripts/verify-dr-package.mjs "$legacy_verify"

          rm -rf dump "$archive" "$primary_verify" "$legacy_verify"
          unset PASSPHRASE
          trap - EXIT

      - name: Assert plaintext removed
        run: |
          set -Eeuo pipefail
          [ ! -d dump ] || { echo "::error::plaintext dump directory remains"; exit 1; }
          [ ! -e "db-backup-$DUMP_DATE.tar.gz" ] || { echo "::error::plaintext archive remains"; exit 1; }
          [ ! -d verify-primary ] || { echo "::error::decrypted primary verification directory remains"; exit 1; }
          [ ! -d verify-legacy ] || { echo "::error::decrypted legacy verification directory remains"; exit 1; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-${{ env.DUMP_DATE }}
          path: |
            db-backup-${{ env.DUMP_DATE }}.tar.gz.gpg
            db-backup-${{ env.DUMP_DATE }}.tar.gz.enc
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "## Backup OK — L2 application DB package, db-backup-$DUMP_DATE (.gpg primary + transitional .enc, 보존 90일)"
            echo ""
            echo "Auth identity 미포함: 이 artifact는 L3/full DR이 아닙니다."
            echo "복호화·검증·복원 절차: docs/OPERATIONS.md \"매일 백업\" 절 참고"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    needs: backup
    if: ${{ always() && needs.backup.result == 'failure' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the backup failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='[Backup] Daily DB backup failed'
          body="Backup DB failed at $(date -u +%FT%TZ). Run: $RUN_URL"
          issue_number=$(gh issue list --state open --search "Daily DB backup failed in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
