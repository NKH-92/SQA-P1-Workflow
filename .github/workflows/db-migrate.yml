name: DB Migrate

# 수동 실행 전용. supabase/migrations의 미적용 마이그레이션을 운영 DB에 적용한다.
# 로컬에 Supabase 인증이 없는 운영자도 GitHub Secrets(SUPABASE_DB_URL)로 적용할 수 있다.
# 적용 정책은 append-only(docs/SUPABASE_MIGRATIONS.md) — 이 워크플로는 새 파일만 push한다.
on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "24시간 이내 main에서 성공했고 암호화 artifact가 남아 있는 Backup DB run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production migration is allowed only from refs/heads/main (received: $GITHUB_REF)."
          exit 1

      - name: Require a recent successful backup
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ github.event.inputs.backup_run_id }}
        run: |
          if ! [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::backup_run_id must be a numeric GitHub Actions run ID"
            exit 1
          fi

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID")
          workflow_path=$(jq -r '.path' <<<"$run_json")
          event=$(jq -r '.event' <<<"$run_json")
          head_branch=$(jq -r '.head_branch' <<<"$run_json")
          head_sha=$(jq -r '.head_sha' <<<"$run_json")
          conclusion=$(jq -r '.conclusion' <<<"$run_json")
          updated_at=$(jq -r '.updated_at' <<<"$run_json")
          age_seconds=$(( $(date -u +%s) - $(date -u -d "$updated_at" +%s) ))
          artifact_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("db-backup-")))] | length')

          if [ "$workflow_path" != ".github/workflows/backup.yml" ] \
            || { [ "$event" != "workflow_dispatch" ] && [ "$event" != "schedule" ]; } \
            || [ "$head_branch" != "main" ] \
            || [ "$head_sha" != "$GITHUB_SHA" ] \
            || [ "$conclusion" != "success" ] \
            || [ "$age_seconds" -lt 0 ] \
            || [ "$age_seconds" -gt 86400 ] \
            || [ "$artifact_count" -lt 1 ]; then
            echo "::error::backup gate failed (path=$workflow_path event=$event branch=$head_branch sha=$head_sha expected_sha=$GITHUB_SHA conclusion=$conclusion age_seconds=$age_seconds artifacts=$artifact_count)"
            exit 1
          fi

      - name: Check secret
        env:
          DB_URL_SET: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          if [ "$DB_URL_SET" != "true" ]; then
            {
              echo "## DB migrate failed — missing secret: SUPABASE_DB_URL"
              echo ""
              echo "Repository Settings > Secrets and variables > Actions에 등록하세요."
              echo "- \`SUPABASE_DB_URL\`: Dashboard > Connect의 Session pooler URI (비밀번호 포함)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      # CLI db push는 supabase_migrations.schema_migrations 이력 기준으로 미적용분을 계산한다.
      # SQL Editor로만 적용해 온 프로젝트(이력 0건 + 스키마 존재)에서 그대로 push하면
      # 전체 재적용을 시도하다 실패하므로, 그 경우 안내를 남기고 push 전에 멈춘다.
      - name: Guard migration history
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          tables=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public'")
          history=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from supabase_migrations.schema_migrations" 2>/dev/null || echo 0)
          echo "public tables: $tables / recorded migrations: $history"
          if [ "$tables" -gt 0 ] && [ "$history" -eq 0 ]; then
            {
              echo "## DB migrate aborted — 스키마는 있는데 migration 이력이 비어 있음"
              echo ""
              echo "이 DB는 SQL Editor로 수동 적용된 것으로 보입니다. 그대로 push하면 전체 재적용을 시도하다 실패합니다."
              echo ""
              echo "조치 중 택1:"
              echo "1. 로컬에서 \`supabase migration repair --status applied <적용된 버전들>\` 후 이 워크플로 재실행"
              echo "2. 미적용 migration 파일만 SQL Editor에서 직접 실행 (docs/SUPABASE_MIGRATIONS.md 순서·확인 SQL 참고)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: List migration status (before)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$DATABASE_URL"

      # Migration history repair is intentionally excluded from this routine.
      # A mismatched/empty history must be handled as a separately reviewed break-glass
      # operation after object-by-object verification; it must never be combined with db push.

      - name: Push pending migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$DATABASE_URL"

      - name: Verify key objects
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          applied=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from supabase_migrations.schema_migrations")
          realtime=$(psql "$DATABASE_URL" -tAc \
            "select exists (select 1 from pg_publication_tables
             where pubname = 'supabase_realtime'
               and schemaname = 'public'
               and tablename = 'review_requests')")
          assignment_rpcs=$(psql "$DATABASE_URL" -tAc \
            "select
              to_regprocedure('public.add_product_assignment(uuid,uuid)') is not null
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.add_product_assignment(uuid,uuid)')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.add_product_assignment(uuid,uuid)')), false)
              and coalesce(has_function_privilege('authenticated', to_regprocedure('public.add_product_assignment(uuid,uuid)'), 'EXECUTE'), false)
              and not coalesce(has_function_privilege('anon', to_regprocedure('public.add_product_assignment(uuid,uuid)'), 'EXECUTE'), true)
              and to_regprocedure('public.add_duty_assignment(uuid,uuid)') is not null
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.add_duty_assignment(uuid,uuid)')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.add_duty_assignment(uuid,uuid)')), false)
              and coalesce(has_function_privilege('authenticated', to_regprocedure('public.add_duty_assignment(uuid,uuid)'), 'EXECUTE'), false)
              and not coalesce(has_function_privilege('anon', to_regprocedure('public.add_duty_assignment(uuid,uuid)'), 'EXECUTE'), true)
              and to_regprocedure('public.replace_project_assignments_if_current(uuid,uuid[],timestamp with time zone)') is not null
              and coalesce((select pg_get_function_result(to_regprocedure('public.replace_project_assignments_if_current(uuid,uuid[],timestamp with time zone)')) = 'timestamp with time zone'), false)
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.replace_project_assignments_if_current(uuid,uuid[],timestamp with time zone)')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.replace_project_assignments_if_current(uuid,uuid[],timestamp with time zone)')), false)
              and coalesce(has_function_privilege('authenticated', to_regprocedure('public.replace_project_assignments_if_current(uuid,uuid[],timestamp with time zone)'), 'EXECUTE'), false)
              and not coalesce(has_function_privilege('anon', to_regprocedure('public.replace_project_assignments_if_current(uuid,uuid[],timestamp with time zone)'), 'EXECUTE'), true)")
          assignment_versions=$(psql "$DATABASE_URL" -tAc \
            "select
              exists (select 1 from supabase_migrations.schema_migrations where version = '202607110001')
              and exists (select 1 from supabase_migrations.schema_migrations where version = '202607110002')
              and exists (select 1 from supabase_migrations.schema_migrations where version = '202607110003')
              and exists (select 1 from supabase_migrations.schema_migrations where version = '202607110004')
              and exists (select 1 from supabase_migrations.schema_migrations where version = '202607110005')
              and exists (select 1 from supabase_migrations.schema_migrations where version = '202607110006')
              and exists (select 1 from supabase_migrations.schema_migrations where version = '202607110007')
              and exists (select 1 from supabase_migrations.schema_migrations where version = '202607110008')
              and exists (select 1 from supabase_migrations.schema_migrations where version = '202607110009')
              and exists (select 1 from supabase_migrations.schema_migrations where version = '202607110010')
              and exists (select 1 from supabase_migrations.schema_migrations where version = '202607110011')")
          assignment_guard=$(psql "$DATABASE_URL" -tAc \
            "select
              to_regprocedure('public.validate_assignment_user_active()') is not null
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.validate_assignment_user_active()')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.validate_assignment_user_active()')), false)
              and coalesce(pg_get_functiondef(to_regprocedure('public.validate_assignment_user_active()')) like '%require_profile_role(new.user_id, ''member''%', false)
              and coalesce(pg_get_functiondef(to_regprocedure('public.validate_assignment_user_active()')) like '%profile_is_active(new.user_id)%', false)
              and exists (
                select 1 from pg_trigger
                where tgrelid = 'public.product_assignments'::regclass
                  and tgname = 'product_assignments_validate_active'
                  and tgfoid = to_regprocedure('public.validate_assignment_user_active()')
                  and tgenabled in ('O', 'A')
                  and pg_get_triggerdef(oid) like '%BEFORE INSERT OR UPDATE OF user_id%'
              )
              and exists (
                select 1 from pg_trigger
                where tgrelid = 'public.duty_assignments'::regclass
                  and tgname = 'duty_assignments_validate_active'
                  and tgfoid = to_regprocedure('public.validate_assignment_user_active()')
                  and tgenabled in ('O', 'A')
                  and pg_get_triggerdef(oid) like '%BEFORE INSERT OR UPDATE OF user_id%'
              )")
          leader_ui_gate=$(psql "$DATABASE_URL" -tAc \
            "select
              exists (select 1 from supabase_migrations.schema_migrations where version = '20260714075451')
              and exists (
                select 1 from pg_attribute
                 where attrelid = 'public.products'::regclass
                   and attname = 'unassigned_reason'
                   and not attisdropped
              )
              and exists (
                select 1 from pg_constraint
                 where conrelid = 'public.products'::regclass
                   and conname = 'products_unassigned_reason_length_check'
                   and convalidated
              )
              and to_regprocedure('public.replace_product_assignments_with_reason(uuid,uuid[],text)') is not null
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.replace_product_assignments_with_reason(uuid,uuid[],text)')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.replace_product_assignments_with_reason(uuid,uuid[],text)')), false)
              and coalesce(has_function_privilege('authenticated', to_regprocedure('public.replace_product_assignments_with_reason(uuid,uuid[],text)'), 'EXECUTE'), false)
              and not coalesce(has_function_privilege('anon', to_regprocedure('public.replace_product_assignments_with_reason(uuid,uuid[],text)'), 'EXECUTE'), true)
              and to_regprocedure('public.clear_product_unassigned_reason()') is not null
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.clear_product_unassigned_reason()')), false)
              and not coalesce(has_function_privilege('authenticated', to_regprocedure('public.clear_product_unassigned_reason()'), 'EXECUTE'), true)
              and not coalesce(has_function_privilege('anon', to_regprocedure('public.clear_product_unassigned_reason()'), 'EXECUTE'), true)
              and exists (
                select 1 from pg_trigger
                 where tgrelid = 'public.product_assignments'::regclass
                   and tgname = 'product_assignments_clear_unassigned_reason'
                   and tgfoid = to_regprocedure('public.clear_product_unassigned_reason()')
                   and tgenabled in ('O', 'A')
              )
              and to_regprocedure('public.validate_project_assignment_member()') is not null
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.validate_project_assignment_member()')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.validate_project_assignment_member()')), false)
              and not coalesce(has_function_privilege('authenticated', to_regprocedure('public.validate_project_assignment_member()'), 'EXECUTE'), true)
              and not coalesce(has_function_privilege('anon', to_regprocedure('public.validate_project_assignment_member()'), 'EXECUTE'), true)
              and coalesce(pg_get_functiondef(to_regprocedure('public.validate_project_assignment_member()')) like '%new.user_id = auth.uid()%', false)
              and coalesce(pg_get_functiondef(to_regprocedure('public.validate_project_assignment_member()')) like '%profile_has_role(new.user_id, ''member''%', false)
              and coalesce(pg_get_functiondef(to_regprocedure('public.validate_project_assignment_member()')) like '%is_active_leader()%', false)")
          leader_view_gate=$(psql "$DATABASE_URL" -tAc \
            "select pg_get_viewdef('public.public_leader_profiles'::regclass, true) like '%can_use_app()%'")
          review_status_gate=$(psql "$DATABASE_URL" -tAc \
            "select
              not has_table_privilege('authenticated', 'public.review_requests', 'UPDATE')
              and has_column_privilege('authenticated', 'public.review_requests', 'title', 'UPDATE')
              and has_column_privilege('authenticated', 'public.review_requests', 'description', 'UPDATE')
              and has_column_privilege('authenticated', 'public.review_requests', 'attachment_url', 'UPDATE')
              and has_column_privilege('authenticated', 'public.review_requests', 'due_date', 'UPDATE')
              and not has_column_privilege('authenticated', 'public.review_requests', 'status', 'UPDATE')
              and to_regclass('private.review_status_events') is not null
              and exists (
                select 1 from pg_trigger
                where tgrelid = 'public.review_requests'::regclass
                  and tgname = 'review_requests_record_status_event'
                  and tgenabled in ('O', 'A')
              )")
          private_audit_gate=$(psql "$DATABASE_URL" -tAc \
            "select
              to_regclass('private.audit_events') is not null
              and not has_schema_privilege('authenticated', 'private', 'USAGE')
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('private.record_mutation_audit()')), false)
              and coalesce((select 'search_path=pg_catalog, public, private, pg_temp' = any(proconfig) from pg_proc where oid = to_regprocedure('private.record_mutation_audit()')), false)
              and (
                select count(*) >= 13 from pg_trigger
                where tgfoid = to_regprocedure('private.record_mutation_audit()')
                  and tgenabled in ('O', 'A')
              )
              and exists (
                select 1 from pg_trigger
                where tgrelid = 'public.profile_notes'::regclass
                  and tgname = 'profile_notes_private_audit'
                  and tgfoid = to_regprocedure('private.record_mutation_audit()')
                  and tgenabled in ('O', 'A')
              )
              and exists (
                select 1 from pg_trigger
                where tgrelid = to_regclass('public.announcements')
                  and tgname = 'announcements_private_audit'
                  and tgfoid = to_regprocedure('private.record_mutation_audit()')
                  and tgenabled in ('O', 'A')
              )")
          last_leader_gate=$(psql "$DATABASE_URL" -tAc \
            "select
              to_regprocedure('public.count_active_leaders_except(uuid)') is not null
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.count_active_leaders_except(uuid)')), false)
              and coalesce((select provolatile = 'v' from pg_proc where oid = to_regprocedure('public.count_active_leaders_except(uuid)')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.count_active_leaders_except(uuid)')), false)
              and not coalesce(has_function_privilege('authenticated', to_regprocedure('public.count_active_leaders_except(uuid)'), 'EXECUTE'), true)
              and not coalesce(has_function_privilege('anon', to_regprocedure('public.count_active_leaders_except(uuid)'), 'EXECUTE'), true)
              and pg_get_functiondef(to_regprocedure('public.guard_last_active_leader_profile()')) like '%pg_advisory_xact_lock%'
              and pg_get_functiondef(to_regprocedure('public.guard_last_active_leader_allowed_user()')) like '%pg_advisory_xact_lock%'")
          direct_write_gate=$(psql "$DATABASE_URL" -tAc \
            "select
              exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'review_requests' and policyname = 'review_requests_update_self_pending_or_rejected' and qual like '%can_use_app()%' and qual like '%requester_id%' and qual like '%rejected%' and with_check like '%can_use_app()%' and with_check like '%requester_id%' and with_check like '%rejected%')
              and exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'review_requests' and policyname = 'review_requests_delete_self_pending' and qual like '%can_use_app()%')
              and exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'review_feedback' and policyname = 'review_feedback_update_leader' and qual like '%leader_id = auth.uid()%' and with_check like '%leader_id = auth.uid()%')
              and exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'review_feedback' and policyname = 'review_feedback_delete_leader' and qual like '%leader_id = auth.uid()%')
              and exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'review_feedback' and policyname = 'review_feedback_insert_leader' and with_check like '%is_active_leader()%' and with_check like '%leader_id = auth.uid()%')
              and coalesce(pg_get_functiondef(to_regprocedure('public.is_active_leader()')) like '%password_is_current()%', false)
              and not has_table_privilege('authenticated', 'public.project_assignments', 'INSERT')
              and not has_table_privilege('authenticated', 'public.project_assignments', 'UPDATE')
              and not has_table_privilege('authenticated', 'public.project_assignments', 'DELETE')
              and to_regprocedure('public.bump_project_revision_from_assignment()') is not null
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.bump_project_revision_from_assignment()')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.bump_project_revision_from_assignment()')), false)
              and coalesce((select proacl is not null and proacl::text not like '%{=X%' and proacl::text not like '%,=X%' from pg_proc where oid = to_regprocedure('public.bump_project_revision_from_assignment()')), false)
              and not coalesce(has_function_privilege('authenticated', to_regprocedure('public.bump_project_revision_from_assignment()'), 'EXECUTE'), true)
              and not coalesce(has_function_privilege('anon', to_regprocedure('public.bump_project_revision_from_assignment()'), 'EXECUTE'), true)
              and exists (select 1 from pg_trigger where tgrelid = 'public.project_assignments'::regclass and tgname = 'project_assignments_bump_project_revision' and tgenabled in ('O', 'A'))")
          review_resubmission_gate=$(psql "$DATABASE_URL" -tAc \
            "select
              exists (select 1 from supabase_migrations.schema_migrations where version = '20260715013615')
              and exists (select 1 from pg_attribute where attrelid = 'public.review_requests'::regclass and attname = 'review_round' and attnotnull and not attisdropped)
              and exists (select 1 from pg_attribute where attrelid = 'public.review_requests'::regclass and attname = 'rejection_count' and attnotnull and not attisdropped)
              and exists (select 1 from pg_attribute where attrelid = 'public.review_requests'::regclass and attname = 'last_submitted_at' and attnotnull and not attisdropped)
              and exists (select 1 from pg_constraint where conrelid = 'public.review_requests'::regclass and conname = 'review_requests_review_round_check' and convalidated)
              and exists (select 1 from pg_constraint where conrelid = 'public.review_requests'::regclass and conname = 'review_requests_rejection_count_check' and convalidated)
              and exists (select 1 from pg_attribute where attrelid = 'public.review_feedback'::regclass and attname = 'author_role' and attnotnull and not attisdropped)
              and exists (select 1 from pg_trigger where tgrelid = 'public.review_feedback'::regclass and tgname = 'review_feedback_validate_leader' and tgfoid = to_regprocedure('public.validate_review_feedback_leader()') and tgenabled in ('O', 'A'))
              and exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'review_requests' and policyname = 'review_requests_update_self_pending_or_rejected' and qual like '%can_use_app()%' and qual like '%requester_id%' and qual like '%rejected%' and with_check like '%can_use_app()%' and with_check like '%requester_id%' and with_check like '%rejected%')
              and not has_column_privilege('authenticated', 'public.review_requests', 'review_round', 'UPDATE')
              and not has_column_privilege('authenticated', 'public.review_requests', 'rejection_count', 'UPDATE')
              and not has_column_privilege('authenticated', 'public.review_requests', 'last_submitted_at', 'UPDATE')
              and to_regprocedure('public.resubmit_review_request(uuid,text)') is not null
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.resubmit_review_request(uuid,text)')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.resubmit_review_request(uuid,text)')), false)
              and coalesce((select proacl is not null and proacl::text not like '%{=X%' and proacl::text not like '%,=X%' from pg_proc where oid = to_regprocedure('public.resubmit_review_request(uuid,text)')), false)
              and coalesce(has_function_privilege('authenticated', to_regprocedure('public.resubmit_review_request(uuid,text)'), 'EXECUTE'), false)
              and not coalesce(has_function_privilege('anon', to_regprocedure('public.resubmit_review_request(uuid,text)'), 'EXECUTE'), true)
              and coalesce(pg_get_functiondef(to_regprocedure('public.resubmit_review_request(uuid,text)')) like '%for update%', false)
              and coalesce(pg_get_functiondef(to_regprocedure('public.resubmit_review_request(uuid,text)')) like '%insert into public.review_feedback%', false)
              and coalesce(pg_get_functiondef(to_regprocedure('public.resubmit_review_request(uuid,text)')) like '%insert into public.activity_logs%', false)")
          leader_policy_gate=$(psql "$DATABASE_URL" -tAc \
            "select not exists (
              select 1 from pg_policies
               where schemaname = 'public'
                 and (coalesce(qual, '') like '%is_leader()%' or coalesce(with_check, '') like '%is_leader()%')
                 and coalesce(qual, '') not like '%is_active_leader()%'
                 and coalesce(with_check, '') not like '%is_active_leader()%'
            )")
          review_activity_gate=$(psql "$DATABASE_URL" -tAc \
            "select
              to_regprocedure('public.update_review_request_status(uuid,public.review_status)') is not null
              and to_regprocedure('public.reject_review_request(uuid,text)') is not null
              and to_regprocedure('public.add_review_feedback(uuid,text)') is not null
              and coalesce(pg_get_functiondef(to_regprocedure('public.update_review_request_status(uuid,public.review_status)')) like '%insert into public.activity_logs%', false)
              and coalesce(pg_get_functiondef(to_regprocedure('public.reject_review_request(uuid,text)')) like '%insert into public.activity_logs%', false)
              and coalesce(pg_get_functiondef(to_regprocedure('public.add_review_feedback(uuid,text)')) like '%insert into public.activity_logs%', false)
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.update_review_request_status(uuid,public.review_status)')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.update_review_request_status(uuid,public.review_status)')), false)
              and coalesce((select proacl is not null and proacl::text not like '%{=X%' and proacl::text not like '%,=X%' from pg_proc where oid = to_regprocedure('public.update_review_request_status(uuid,public.review_status)')), false)
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.reject_review_request(uuid,text)')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.reject_review_request(uuid,text)')), false)
              and coalesce((select proacl is not null and proacl::text not like '%{=X%' and proacl::text not like '%,=X%' from pg_proc where oid = to_regprocedure('public.reject_review_request(uuid,text)')), false)
              and coalesce((select prosecdef from pg_proc where oid = to_regprocedure('public.add_review_feedback(uuid,text)')), false)
              and coalesce((select exists (select 1 from unnest(proconfig) cfg where cfg in ('search_path=' || chr(34) || chr(34), 'search_path=')) from pg_proc where oid = to_regprocedure('public.add_review_feedback(uuid,text)')), false)
              and coalesce((select proacl is not null and proacl::text not like '%{=X%' and proacl::text not like '%,=X%' from pg_proc where oid = to_regprocedure('public.add_review_feedback(uuid,text)')), false)
              and has_function_privilege('authenticated', to_regprocedure('public.update_review_request_status(uuid,public.review_status)'), 'EXECUTE')
              and has_function_privilege('authenticated', to_regprocedure('public.reject_review_request(uuid,text)'), 'EXECUTE')
              and has_function_privilege('authenticated', to_regprocedure('public.add_review_feedback(uuid,text)'), 'EXECUTE')
              and not has_function_privilege('anon', to_regprocedure('public.update_review_request_status(uuid,public.review_status)'), 'EXECUTE')
              and not has_function_privilege('anon', to_regprocedure('public.reject_review_request(uuid,text)'), 'EXECUTE')
              and not has_function_privilege('anon', to_regprocedure('public.add_review_feedback(uuid,text)'), 'EXECUTE')")
          announcements_gate=$(psql "$DATABASE_URL" -tAc \
            "select
              exists (select 1 from supabase_migrations.schema_migrations where version = '20260716200422')
              and to_regclass('public.announcements') is not null
              and coalesce((select relrowsecurity from pg_class where oid = to_regclass('public.announcements')), false)
              and exists (select 1 from pg_constraint where conrelid = to_regclass('public.announcements') and conname = 'announcements_title_length_check' and convalidated)
              and exists (select 1 from pg_constraint where conrelid = to_regclass('public.announcements') and conname = 'announcements_body_length_check' and convalidated)
              and exists (select 1 from pg_constraint where conrelid = to_regclass('public.announcements') and conname = 'announcements_pin_state_check' and convalidated)
              and exists (select 1 from pg_class where oid = to_regclass('public.announcements_created_by_idx') and relkind = 'i')
              and exists (select 1 from pg_class where oid = to_regclass('public.announcements_board_order_idx') and relkind = 'i')
              and exists (select 1 from pg_trigger where tgrelid = to_regclass('public.announcements') and tgname = 'announcements_enforce_invariants' and tgfoid = to_regprocedure('private.enforce_announcement_invariants()') and tgenabled in ('O', 'A'))
              and exists (select 1 from pg_trigger where tgrelid = to_regclass('public.announcements') and tgname = 'announcements_set_updated_at' and tgfoid = to_regprocedure('public.set_updated_at()') and tgenabled in ('O', 'A'))
              and exists (select 1 from pg_trigger where tgrelid = to_regclass('public.announcements') and tgname = 'announcements_private_audit' and tgfoid = to_regprocedure('private.record_mutation_audit()') and tgenabled in ('O', 'A'))
              and to_regprocedure('private.enforce_announcement_invariants()') is not null
              and not coalesce((select prosecdef from pg_proc where oid = to_regprocedure('private.enforce_announcement_invariants()')), true)
              and coalesce((select 'search_path=pg_catalog, public, private, pg_temp' = any(proconfig) from pg_proc where oid = to_regprocedure('private.enforce_announcement_invariants()')), false)
              and not coalesce(has_function_privilege('authenticated', to_regprocedure('private.enforce_announcement_invariants()'), 'EXECUTE'), true)
              and not coalesce(has_function_privilege('anon', to_regprocedure('private.enforce_announcement_invariants()'), 'EXECUTE'), true)
              and coalesce(pg_get_functiondef(to_regprocedure('private.enforce_announcement_invariants()')) like '%new.title := btrim(new.title)%', false)
              and coalesce(pg_get_functiondef(to_regprocedure('private.enforce_announcement_invariants()')) like '%new.created_by is distinct from old.created_by%', false)
              and coalesce(pg_get_functiondef(to_regprocedure('private.enforce_announcement_invariants()')) like '%new.created_at is distinct from old.created_at%', false)
              and coalesce(pg_get_functiondef(to_regprocedure('private.enforce_announcement_invariants()')) like '%new.pinned_at := now()%', false)
              and coalesce(has_table_privilege('authenticated', to_regclass('public.announcements'), 'SELECT'), false)
              and coalesce(has_table_privilege('authenticated', to_regclass('public.announcements'), 'DELETE'), false)
              and not coalesce(has_table_privilege('authenticated', to_regclass('public.announcements'), 'INSERT'), true)
              and not coalesce(has_table_privilege('authenticated', to_regclass('public.announcements'), 'UPDATE'), true)
              and coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'title', 'INSERT'), false)
              and coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'body', 'INSERT'), false)
              and coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'is_pinned', 'INSERT'), false)
              and coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'title', 'UPDATE'), false)
              and coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'body', 'UPDATE'), false)
              and coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'is_pinned', 'UPDATE'), false)
              and not coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'pinned_at', 'INSERT'), true)
              and not coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'pinned_at', 'UPDATE'), true)
              and not coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'created_by', 'INSERT'), true)
              and not coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'created_by', 'UPDATE'), true)
              and not coalesce(has_column_privilege('authenticated', to_regclass('public.announcements'), 'created_at', 'UPDATE'), true)
              and not coalesce(has_table_privilege('anon', to_regclass('public.announcements'), 'SELECT'), true)
              and not coalesce(has_table_privilege('anon', to_regclass('public.announcements'), 'INSERT'), true)
              and not coalesce(has_table_privilege('anon', to_regclass('public.announcements'), 'UPDATE'), true)
              and not coalesce(has_table_privilege('anon', to_regclass('public.announcements'), 'DELETE'), true)
              and exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'announcements' and policyname = 'announcements_select_app_user' and qual like '%is_active_self()%' and qual not like '%can_use_app()%')
              and exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'announcements' and policyname = 'announcements_insert_leader' and with_check like '%is_active_leader()%' and with_check like '%created_by%' and with_check like '%auth.uid()%')
              and exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'announcements' and policyname = 'announcements_update_leader' and qual like '%is_active_leader()%' and with_check like '%is_active_leader()%')
              and exists (select 1 from pg_policies where schemaname = 'public' and tablename = 'announcements' and policyname = 'announcements_delete_leader' and qual like '%is_active_leader()%')")
          local_count=$(ls supabase/migrations/*.sql | wc -l)

          if [ "$realtime" != "t" ]; then
            {
              echo "## DB migrate FAILED — realtime publication 검증 실패"
              echo ""
              echo "push는 끝났지만 review_requests가 supabase_realtime publication에 없습니다 (202607090001 미반영)."
              echo "docs/SUPABASE_MIGRATIONS.md의 확인 SQL로 상태를 점검하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::review_requests is not in the supabase_realtime publication (202607090001 not applied)"
            exit 1
          fi

          if [ "$assignment_versions" != "t" ]; then
            echo "::error::required assignment migrations are not recorded (received: $assignment_versions)"
            exit 1
          fi

          if [ "$assignment_rpcs" != "t" ]; then
            echo "::error::assignment RPC existence/security/ACL verification failed (received: $assignment_rpcs)"
            exit 1
          fi

          if [ "$assignment_guard" != "t" ]; then
            echo "::error::assignment member/active trigger invariant verification failed (received: $assignment_guard)"
            exit 1
          fi

          if [ "$leader_ui_gate" != "t" ]; then
            echo "::error::leader UI product-reason/current-leader assignment contract verification failed (received: $leader_ui_gate)"
            exit 1
          fi

          if [ "$leader_view_gate" != "t" ]; then
            echo "::error::public_leader_profiles access gate verification failed (received: $leader_view_gate)"
            exit 1
          fi

          if [ "$review_status_gate" != "t" ]; then
            echo "::error::review status RPC-only/audit verification failed (received: $review_status_gate)"
            exit 1
          fi

          if [ "$private_audit_gate" != "t" ]; then
            echo "::error::private mutation audit verification failed (received: $private_audit_gate)"
            exit 1
          fi

          if [ "$last_leader_gate" != "t" ]; then
            echo "::error::last-active-leader serialization verification failed (received: $last_leader_gate)"
            exit 1
          fi

          if [ "$direct_write_gate" != "t" ]; then
            echo "::error::direct write/OCC hardening verification failed (received: $direct_write_gate)"
            exit 1
          fi

          if [ "$review_resubmission_gate" != "t" ]; then
            echo "::error::review resubmission/history contract verification failed (received: $review_resubmission_gate)"
            exit 1
          fi

          if [ "$review_activity_gate" != "t" ]; then
            echo "::error::transactional review activity-log verification failed (received: $review_activity_gate)"
            exit 1
          fi

          if [ "$leader_policy_gate" != "t" ]; then
            echo "::error::role-only leader RLS policy detected; active/password gate is not proven (received: $leader_policy_gate)"
            exit 1
          fi

          if [ "$announcements_gate" != "t" ]; then
            echo "::error::announcement board schema/RLS/grants/audit verification failed (received: $announcements_gate)"
            exit 1
          fi

          {
            echo "## DB migrate OK"
            echo ""
            echo "- 로컬 migration 파일: $local_count개 / 원격 기록: $applied개"
            echo "- realtime publication에 review_requests 포함: $realtime"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "assignment migration versions: $assignment_versions" >> "$GITHUB_STEP_SUMMARY"
          echo "assignment RPC security/ACL checks: $assignment_rpcs" >> "$GITHUB_STEP_SUMMARY"
          echo "assignment member/active trigger checks: $assignment_guard" >> "$GITHUB_STEP_SUMMARY"
          echo "leader UI product reason/current-leader assignment gate: $leader_ui_gate" >> "$GITHUB_STEP_SUMMARY"
          echo "leader profile view app-access gate: $leader_view_gate" >> "$GITHUB_STEP_SUMMARY"
          echo "review status RPC-only/audit gate: $review_status_gate" >> "$GITHUB_STEP_SUMMARY"
          echo "private mutation audit gate: $private_audit_gate" >> "$GITHUB_STEP_SUMMARY"
          echo "last-active-leader serialization gate: $last_leader_gate" >> "$GITHUB_STEP_SUMMARY"
          echo "direct write/OCC hardening gate: $direct_write_gate" >> "$GITHUB_STEP_SUMMARY"
          echo "review resubmission/history gate: $review_resubmission_gate" >> "$GITHUB_STEP_SUMMARY"
          echo "transactional review activity-log gate: $review_activity_gate" >> "$GITHUB_STEP_SUMMARY"
          echo "active/password leader policy gate: $leader_policy_gate" >> "$GITHUB_STEP_SUMMARY"
          echo "announcement board schema/RLS/grants/audit gate: $announcements_gate" >> "$GITHUB_STEP_SUMMARY"

          if [ "$applied" != "$local_count" ]; then
            echo "::error::remote schema_migrations count ($applied) does not match local file count ($local_count); refusing a green drifted migration run"
            exit 1
          fi
