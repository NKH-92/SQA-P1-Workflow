name: DB Migrate

# 수동 실행 전용. supabase/migrations의 미적용 마이그레이션을 운영 DB에 적용한다.
# 로컬에 Supabase 인증이 없는 운영자도 GitHub Secrets(SUPABASE_DB_URL)로 적용할 수 있다.
# 적용 정책은 append-only(docs/SUPABASE_MIGRATIONS.md) — 이 워크플로는 새 파일만 push한다.
on:
  workflow_dispatch:
    inputs:
      backup_run_id:
        description: "24시간 이내 main에서 성공했고 암호화 artifact가 남아 있는 Backup DB run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production migration is allowed only from refs/heads/main (received: $GITHUB_REF)."
          exit 1

      - name: Require a recent successful backup
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_RUN_ID: ${{ github.event.inputs.backup_run_id }}
        run: |
          if ! [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::backup_run_id must be a numeric GitHub Actions run ID"
            exit 1
          fi

          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID")
          workflow_path=$(jq -r '.path' <<<"$run_json")
          event=$(jq -r '.event' <<<"$run_json")
          head_branch=$(jq -r '.head_branch' <<<"$run_json")
          head_sha=$(jq -r '.head_sha' <<<"$run_json")
          conclusion=$(jq -r '.conclusion' <<<"$run_json")
          updated_at=$(jq -r '.updated_at' <<<"$run_json")
          age_seconds=$(( $(date -u +%s) - $(date -u -d "$updated_at" +%s) ))
          artifact_count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.expired == false and (.name | startswith("db-backup-")))] | length')

          if [ "$workflow_path" != ".github/workflows/backup.yml" ] \
            || { [ "$event" != "workflow_dispatch" ] && [ "$event" != "schedule" ]; } \
            || [ "$head_branch" != "main" ] \
            || [ "$head_sha" != "$GITHUB_SHA" ] \
            || [ "$conclusion" != "success" ] \
            || [ "$age_seconds" -lt 0 ] \
            || [ "$age_seconds" -gt 86400 ] \
            || [ "$artifact_count" -lt 1 ]; then
            echo "::error::backup gate failed (path=$workflow_path event=$event branch=$head_branch sha=$head_sha expected_sha=$GITHUB_SHA conclusion=$conclusion age_seconds=$age_seconds artifacts=$artifact_count)"
            exit 1
          fi

      - name: Check secret
        env:
          DB_URL_SET: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          if [ "$DB_URL_SET" != "true" ]; then
            {
              echo "## DB migrate failed — missing secret: SUPABASE_DB_URL"
              echo ""
              echo "Repository Settings > Secrets and variables > Actions에 등록하세요."
              echo "- \`SUPABASE_DB_URL\`: Dashboard > Connect의 Session pooler URI (비밀번호 포함)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.109.1

      # CLI db push는 supabase_migrations.schema_migrations 이력 기준으로 미적용분을 계산한다.
      # SQL Editor로만 적용해 온 프로젝트(이력 0건 + 스키마 존재)에서 그대로 push하면
      # 전체 재적용을 시도하다 실패하므로, 그 경우 안내를 남기고 push 전에 멈춘다.
      - name: Guard migration history
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          tables=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from information_schema.tables where table_schema = 'public'")
          history=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from supabase_migrations.schema_migrations" 2>/dev/null || echo 0)
          echo "public tables: $tables / recorded migrations: $history"
          if [ "$tables" -gt 0 ] && [ "$history" -eq 0 ]; then
            {
              echo "## DB migrate aborted — 스키마는 있는데 migration 이력이 비어 있음"
              echo ""
              echo "이 DB는 SQL Editor로 수동 적용된 것으로 보입니다. 그대로 push하면 전체 재적용을 시도하다 실패합니다."
              echo ""
              echo "조치 중 택1:"
              echo "1. 로컬에서 \`supabase migration repair --status applied <적용된 버전들>\` 후 이 워크플로 재실행"
              echo "2. 미적용 migration 파일만 SQL Editor에서 직접 실행 (docs/SUPABASE_MIGRATIONS.md 순서·확인 SQL 참고)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: List migration status (before)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$DATABASE_URL"

      - name: Guard Stage B Storage handoff
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          object_count=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from storage.objects where bucket_id = 'review-attachments'")
          bucket_count=$(psql "$DATABASE_URL" -tAc \
            "select count(*) from storage.buckets where id = 'review-attachments'")
          if [ "$object_count" -ne 0 ] || [ "$bucket_count" -ne 0 ]; then
            echo "::error::SQA_REVIEW_ATTACHMENTS_BUCKET_STILL_EXISTS: operator Storage API evidence must show objectCount=0 and bucketExists=false before Stage B (objects=$object_count buckets=$bucket_count)"
            exit 1
          fi

      # Migration history repair is intentionally excluded from this routine.
      # A mismatched/empty history must be handled as a separately reviewed break-glass
      # operation after object-by-object verification; it must never be combined with db push.

      - name: Push pending migrations
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$DATABASE_URL"

      - name: Verify production DB readiness from canonical SQL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node scripts/validate-readiness-manifest.mjs
          while IFS= read -r readiness_sql; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "scripts/sql/verify/$readiness_sql"
          done < <(node -e "const m=require('./scripts/sql/verify/manifest.json'); process.stdout.write(m.readinessFiles.join('\n'))")
          {
            echo "## DB migrate OK"
            echo ""
            echo "- migration history: exact manifest set verified"
            echo "- canonical readiness: SQA_DB_READY_OK"
          } >> "$GITHUB_STEP_SUMMARY"
