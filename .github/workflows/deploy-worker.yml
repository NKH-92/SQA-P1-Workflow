name: Deploy Worker

on:
  # Production promotion is deliberate and requires the team leader's approval;
  # main pushes only run CI.
  workflow_dispatch:
    inputs:
      deploy_confirm:
        description: "Confirm that the reviewed RLS/build/readiness evidence is for this SHA"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production verification is allowed only from refs/heads/main (received: $GITHUB_REF)."
          exit 1

  rls:
    needs: guard
    uses: ./.github/workflows/reusable-rls.yml
  deploy:
    needs: rls
    runs-on: ubuntu-latest
    environment: production
    # 시크릿은 job 레벨에 두지 않는다 — npm ci/test가 실행하는 서드파티 코드에
    # 노출되지 않도록 실제로 쓰는 단계(Build, Deploy)에만 주입한다.
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      WORKER_URL: ${{ vars.WORKER_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}

    steps:
      - name: Require main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Production deployment is allowed only from refs/heads/main (received: $GITHUB_REF)."
          exit 1

      - name: Require explicit deployment confirmation
        if: ${{ inputs.deploy_confirm != true }}
        run: |
          echo "::error::Production deployment requires deploy_confirm=true after reviewing the RLS and DB readiness evidence."
          exit 1

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check deploy configuration
        env:
          CF_TOKEN_SET: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          ANON_KEY_SET: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' }}
          DB_URL_SET: ${{ secrets.SUPABASE_DB_URL != '' }}
        run: |
          missing=()
          if [ "$CF_TOKEN_SET" != "true" ]; then
            missing+=("CLOUDFLARE_API_TOKEN (secret)")
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            missing+=("CLOUDFLARE_ACCOUNT_ID (variable)")
          fi
          if [ -z "$WORKER_NAME" ]; then
            missing+=("WORKER_NAME (variable)")
          fi
          if [ -z "$WORKER_URL" ]; then
            missing+=("WORKER_URL (variable; post-deploy health check)")
          fi
          if [ -z "$VITE_SUPABASE_URL" ]; then
            missing+=("VITE_SUPABASE_URL (variable)")
          fi
          if [ "$ANON_KEY_SET" != "true" ]; then
            missing+=("VITE_SUPABASE_ANON_KEY (secret)")
          fi
          if [ "$DB_URL_SET" != "true" ]; then
            missing+=("SUPABASE_DB_URL (secret; deploy DB-readiness gate)")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "## Deploy configuration incomplete"
              echo ""
              echo "The following GitHub Actions settings are missing:"
              echo ""
              for item in "${missing[@]}"; do
                echo "- \`$item\`"
              done
              echo ""
              echo "**Result:** deployment was **blocked and this workflow failed**. No production deploy occurred."
              echo "Register the missing Variables/Secrets under Repository Settings > Secrets and variables > Actions, then rerun the confirmed manual deployment."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Deploy configuration is incomplete; refusing a green no-op production run. See job summary."
            exit 1
          fi

      - name: Verify production DB readiness from canonical SQL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node scripts/validate-readiness-manifest.mjs
          while IFS= read -r readiness_sql; do
            psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f "scripts/sql/verify/$readiness_sql"
          done < <(node -e "const m=require('./scripts/sql/verify/manifest.json'); process.stdout.write(m.readinessFiles.join('\n'))")
      - name: Verify Supabase public configuration
        env:
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          settings_file=$(mktemp)
          trap 'rm -f "$settings_file"' EXIT
          curl --fail --silent --show-error --max-time 20 \
            --header "apikey: $VITE_SUPABASE_ANON_KEY" \
            "${VITE_SUPABASE_URL%/}/auth/v1/settings" \
            -o "$settings_file"
          jq -e '
            type == "object"
            and .disable_signup == true
            and .mailer_autoconfirm == false
            and .external.email == true
            and .external.anonymous_users == false
          ' "$settings_file" >/dev/null || {
            echo "::error::Supabase Auth settings drifted: require signup off, email confirmation on, anonymous off, email provider on"
            exit 1
          }

      - name: Build
        run: npm run build
        env:
          VITE_APP_MODE: production
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --no-install wrangler deploy --name "$WORKER_NAME" --assets dist --keep-vars --compatibility-date 2026-07-04
          {
            echo "## Deploy succeeded"
            echo ""
            echo "Worker \`$WORKER_NAME\` was deployed to Cloudflare."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify deployed Worker health
        run: |
          body_file=$(mktemp)
          headers_file=$(mktemp)
          trap 'rm -f "$body_file" "$headers_file"' EXIT

          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 \
            "$WORKER_URL" -o "$body_file"
          grep -Fq 'id="root"' "$body_file" || {
            echo "::error::Worker health check failed: root mount was not found"
            exit 1
          }

          curl --fail --silent --show-error --location --head \
            --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 \
            "$WORKER_URL" -o "$headers_file"
          grep -Eqi '^content-security-policy:' "$headers_file" || {
            echo "::error::Worker health check failed: Content-Security-Policy header is missing"
            exit 1
          }
          grep -Eqi '^x-content-type-options:[[:space:]]*nosniff' "$headers_file" || {
            echo "::error::Worker health check failed: X-Content-Type-Options nosniff is missing"
            exit 1
          }

          echo "- post-deploy health check: root mount and security headers verified" >> "$GITHUB_STEP_SUMMARY"
