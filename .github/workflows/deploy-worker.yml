name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check deploy configuration
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::GitHub secret CLOUDFLARE_API_TOKEN is not set."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::GitHub variable CLOUDFLARE_ACCOUNT_ID is not set."
            missing=1
          fi
          if [ -z "$WORKER_NAME" ]; then
            echo "::warning::GitHub variable WORKER_NAME is not set."
            missing=1
          fi
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::warning::GitHub variable VITE_SUPABASE_URL is not set."
            missing=1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::warning::GitHub secret VITE_SUPABASE_ANON_KEY is not set."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "DEPLOY_SKIP=true" >> "$GITHUB_ENV"
            echo "::warning::Build will run, but deployment will be skipped until variables/secrets are configured."
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Workers
        if: ${{ env.DEPLOY_SKIP != 'true' }}
        run: npx --yes wrangler@4 deploy --name "$WORKER_NAME" --assets dist --keep-vars --compatibility-date 2026-07-04
