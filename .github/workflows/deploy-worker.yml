name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: ${{ vars.WORKER_NAME }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check deploy configuration
        run: |
          missing=()
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            missing+=("CLOUDFLARE_API_TOKEN (secret)")
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            missing+=("CLOUDFLARE_ACCOUNT_ID (variable)")
          fi
          if [ -z "$WORKER_NAME" ]; then
            missing+=("WORKER_NAME (variable)")
          fi
          if [ -z "$VITE_SUPABASE_URL" ]; then
            missing+=("VITE_SUPABASE_URL (variable)")
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            missing+=("VITE_SUPABASE_ANON_KEY (secret)")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "## Deploy configuration incomplete"
              echo ""
              echo "The following GitHub Actions settings are missing:"
              echo ""
              for item in "${missing[@]}"; do
                echo "- \`$item\`"
              done
              echo ""
              if [ "${{ github.event_name }}" = "push" ]; then
                echo "**Result:** this \`main\` push workflow **failed** — build ran, but deployment did not occur."
                echo "Register the missing Variables/Secrets under Repository Settings > Secrets and variables > Actions, then push again."
              else
                echo "**Result:** deployment was **skipped** (test-only). This is allowed for \`workflow_dispatch\`."
                echo "Register the missing Variables/Secrets before expecting an automatic deploy on \`main\` push."
              fi
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::Deploy configuration missing on main push. See job summary."
              exit 1
            fi

            echo "DEPLOY_SKIP=true" >> "$GITHUB_ENV"
            echo "::warning::Tests will run, but build and deployment will be skipped until variables/secrets are configured."
          fi

      - name: Build
        if: ${{ env.DEPLOY_SKIP != 'true' }}
        run: npm run build
        env:
          VITE_APP_MODE: production
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ env.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Workers
        if: ${{ env.DEPLOY_SKIP != 'true' }}
        run: |
          npx --yes wrangler@4 deploy --name "$WORKER_NAME" --assets dist --keep-vars --compatibility-date 2026-07-04
          {
            echo "## Deploy succeeded"
            echo ""
            echo "Worker \`$WORKER_NAME\` was deployed to Cloudflare."
          } >> "$GITHUB_STEP_SUMMARY"
