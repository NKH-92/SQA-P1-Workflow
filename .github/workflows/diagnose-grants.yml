name: Diagnose Grants (temporary, read-only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect leader RLS policies and drift (read-only)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail

          echo "=== public policies with is_leader() but NOT is_active_leader() (gate offenders) ==="
          psql "$DATABASE_URL" -tA -F '|' -c "
            select tablename, policyname, cmd,
                   coalesce(qual,'') as using_expr,
                   coalesce(with_check,'') as check_expr
            from pg_policies
            where schemaname = 'public'
              and (coalesce(qual,'') like '%is_leader()%' or coalesce(with_check,'') like '%is_leader()%')
              and coalesce(qual,'') not like '%is_active_leader()%'
              and coalesce(with_check,'') not like '%is_active_leader()%'
            order by tablename, policyname
          "

          echo "=== gate boolean (should be t once fixed) ==="
          psql "$DATABASE_URL" -tA -c "
            select not exists (
              select 1 from pg_policies
               where schemaname = 'public'
                 and (coalesce(qual,'') like '%is_leader()%' or coalesce(with_check,'') like '%is_leader()%')
                 and coalesce(qual,'') not like '%is_active_leader()%'
                 and coalesce(with_check,'') not like '%is_active_leader()%'
            )
          "

          echo "=== drift preview: applied vs local ==="
          psql "$DATABASE_URL" -tA -c "select count(*) as applied from supabase_migrations.schema_migrations"
